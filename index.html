    <script>
      // Defensive guard to ensure window.fetch is safely configurable and writable
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const originalFetch = window.fetch;
          try {
            Object.defineProperty(window, 'fetch', {
              value: originalFetch,
              writable: true,
              configurable: true,
              enumerable: true,
            });
          } catch (_) {
            // Already configurable or protected
          }
        }
      } catch (_) {}
    </script>

  </body>
